[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-document-pipeline-v2"
version = "2.0.0"
description = "Offline semantic-preserving de-identification for academic application PDFs"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "PyMuPDF>=1.26,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
academic-pipeline-v2 = "academic_pipeline_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

