input_roots:
  - /protected/recruitment_JPF01795
output_root: /protected/v2/runs/run_001
state_root: /protected/v2/state
namespace: ucr-academic-recruitment
cpu_workers: 4

ocr:
  enabled: true
  device: cpu
  language: en
  dpi: 180
  minimum_alphanumeric: 40
  minimum_printable_ratio: 0.85
  maximum_replacement_ratio: 0.05
  minimum_ocr_confidence: 0.85
  text_detection_model_dir: /protected/models/paddleocr/text_detection
  text_recognition_model_dir: /protected/models/paddleocr/text_recognition
  textline_orientation_model_dir: /protected/models/paddleocr/textline_orientation

model:
  backend: vllm
  model: Qwen/Qwen3-14B
  base_url: http://127.0.0.1:8000/v1
  api_key: local-only
  context_length: 32768
  max_inflight: 4
  cv_max_tokens: 8192
  letter_max_tokens: 4096
  qa_max_tokens: 2048
  timeout_seconds: 600
  max_retries: 1
  store_raw_responses: false

ner:
  enabled: false
  backend: none
  model_path: null
  device: cpu
  minimum_score: 0.65
  chunk_characters: 2000
  candidates_per_call: 40

privacy:
  policy_path: privacy_policy.yaml
  maximum_repairs: 2
  review_fraction: 0.10
  review_minimum: 20
  require_human_review: true
