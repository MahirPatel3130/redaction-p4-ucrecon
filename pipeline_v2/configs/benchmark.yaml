input_roots:
  - ../fixtures/generated/applications
output_root: ../runs/benchmark_qwen14b
state_root: ../state/benchmark
namespace: v2-synthetic-benchmark
cpu_workers: 4
ocr:
  enabled: true
  device: cpu
  language: en
  dpi: 180
  text_detection_model_dir: /protected/models/paddleocr/text_detection
  text_recognition_model_dir: /protected/models/paddleocr/text_recognition
model:
  backend: vllm
  model: Qwen/Qwen3-14B
  base_url: http://127.0.0.1:8000/v1
  context_length: 32768
  max_inflight: 4
  store_raw_responses: false
privacy:
  policy_path: privacy_policy.yaml
  maximum_repairs: 2
  review_fraction: 0.10
  review_minimum: 20
  require_human_review: true
